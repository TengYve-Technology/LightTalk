<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Chat</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>
            <div id="login-form" class="form-panel active">
                <h2>欢迎回来</h2>
                <form id="login-form-element">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input type="text" id="login-username" name="username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary">登录</button>
                </form>
                <p id="login-error" class="error-message"></p>
            </div>
            <div id="register-form" class="form-panel">
                <h2>创建账号</h2>
                <form id="register-form-element">
                    <div class="form-group">
                        <label for="register-username">用户名</label>
                        <input type="text" id="register-username" name="username" required minlength="3" maxlength="20" autocomplete="username">
                        <span class="hint">3-20位字符</span>
                    </div>
                    <div class="form-group">
                        <label for="register-displayName">显示名称</label>
                        <input type="text" id="register-displayName" name="displayName" required maxlength="30" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" name="password" required minlength="6" autocomplete="new-password">
                        <span class="hint">至少6位字符</span>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm">确认密码</label>
                        <input type="password" id="register-confirm" name="confirm" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">注册</button>
                </form>
                <p id="register-error" class="error-message"></p>
            </div>
        </div>
    </div>
    <div id="app" class="app hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>局域网聊天室</h1>
                <div class="user-info">
                    <div class="avatar" id="user-avatar"></div>
                    <div class="user-details">
                        <span id="user-display-name"></span>
                        <span class="status online" id="user-status">在线</span>
                    </div>
                </div>
            </div>
    
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="rooms">房间</button>
                <button class="tab-btn" data-tab="users">用户</button>
                <button class="tab-btn" data-tab="settings">设置</button>
            </div>
    
            <div id="rooms-panel" class="panel active">
                <div class="panel-header">
                    <h3>房间</h3>
                    <button class="btn btn-sm btn-icon" id="create-room-btn" title="创建房间">+</button>
                </div>
                <ul class="room-list" id="room-list">
                    <li class="room-item active" data-room="lobby">
                        <span class="room-icon">#</span>
                        <span class="room-name">大厅</span>
                        <span class="room-count" id="lobby-count">0</span>
                    </li>
                </ul>
            </div>
            
            <div id="users-panel" class="panel">
                <div class="panel-header">
                    <h3>用户</h3>
                    <input type="text" class="search-input" id="user-search" placeholder="搜索用户...">
                </div>
                <ul class="user-list" id="user-list"></ul>
            </div>
    
            <div id="settings-panel" class="panel">
                <div class="settings-section">
                    <h4>我的资料</h4>
                    <div class="form-group">
                        <label>头像</label>
                        <div class="avatar-upload">
                            <div class="avatar large" id="settings-avatar"></div>
                            <input type="file" id="avatar-input" accept="image/*" hidden>
                            <button class="btn btn-secondary btn-sm" id="change-avatar-btn" type="button">更换头像</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="settings-displayName">显示名称</label>
                        <input type="text" id="settings-displayName" maxlength="30">
                    </div>
                    <button class="btn btn-primary" id="save-profile-btn">保存资料</button>
                </div>
                <div class="settings-section">
                    <h4>修改密码</h4>
                    <div class="form-group">
                        <label for="current-password">当前密码</label>
                        <input type="password" id="current-password" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="new-password">新密码</label>
                        <input type="password" id="new-password" minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm-new-password">确认新密码</label>
                        <input type="password" id="confirm-new-password" autocomplete="new-password">
                    </div>
                    <button class="btn btn-primary" id="change-password-btn">修改密码</button>
                </div>
                <div class="settings-section">
                    <button class="btn btn-danger" id="logout-btn">退出登录</button>
                </div>
            </div>
        </aside>
    
        <main class="main">
            <header class="chat-header">
                <div class="room-info">
                    <span class="room-icon" id="current-room-icon">#</span>
                    <span id="current-room-name">大厅</span>
                    <span class="room-status" id="room-status">0 人在线</span>
                </div>
                <div class="chat-actions">
                    <button class="btn btn-icon" id="emoji-btn" title="表情">😊</button>
                    <button class="btn btn-icon" id="attach-btn" title="发送文件">📎</button>
                    <input type="file" id="file-input" hidden>
                </div>
            </header>
    
            <div class="messages-container">
                <div class="messages" id="messages"></div>
                <button class="btn btn-secondary load-more" id="load-more">加载更多</button>
            </div>
    
            <div class="message-input-area">
                <div class="reply-preview hidden" id="reply-preview">
                    <span class="reply-preview-text" id="reply-preview-text"></span>
                    <button class="btn btn-sm btn-icon" id="cancel-reply" title="取消回复">×</button>
                </div>
                <form id="message-form">
                    <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off">
                    <button type="submit" class="btn btn-primary" id="send-btn">发送</button>
                </form>
            </div>
        </main>
    </div>
    
    <div id="create-room-modal" class="modal hidden">
        <div class="modal-content small">
            <button class="close-btn" id="close-create-room-modal">×</button>
            <h2>创建房间</h2>
            <form id="create-room-form">
                <div class="form-group">
                    <label for="new-room-name">房间名称</label>
                    <input type="text" id="new-room-name" name="name" required maxlength="30">
                </div>
                <div class="form-group">
                    <label for="new-room-description">描述 (可选)</label>
                    <textarea id="new-room-description" name="description" maxlength="200" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-create-room">取消</button>
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="image-modal" class="modal hidden">
        <div class="modal-content image-modal">
            <button class="close-btn" id="close-image-modal">×</button>
            <img id="modal-image" src="" alt="图片预览">
        </div>
    </div>
    
    <div id="context-menu" class="context-menu hidden">
        <button class="reply-action">回复</button>
        <button class="delete-action own-only danger">删除</button>
        <button class="copy-action">复制</button>
    </div>
    
    <div class="emoji-picker hidden" id="emoji-picker"></div>
    
    <script src="/js/app.js"></script>
</body>
</html>
